name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

# a newer push to the same branch cancels the runs that are still going
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # a bare --parallel means "unlimited jobs" for Makefiles, which can run out of memory.
  # GitHub's standard runners have 4 cores
  CMAKE_BUILD_PARALLEL_LEVEL: 4

jobs:
  test:
    name: ${{ matrix.platform.name }} (${{ matrix.config }})
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false # see every platform's result, not just the first failure
      matrix:
        config: [Debug, Release]
        platform:
          - name: Windows x64
            os: windows-latest
            cmake-args: -A x64
          - name: Windows x86
            os: windows-latest
            cmake-args: -A Win32
          - name: macOS
            os: macos-latest
            cmake-args: ""
          - name: Linux GCC
            os: ubuntu-24.04
            cmake-args: -DCMAKE_CXX_COMPILER=g++
          - name: Linux Clang
            os: ubuntu-24.04
            cmake-args: -DCMAKE_CXX_COMPILER=clang++

    steps:
      - uses: actions/checkout@v4

      # Visual Studio is a multi-config generator: it ignores CMAKE_BUILD_TYPE and uses --config / -C instead.
      # The other generators use CMAKE_BUILD_TYPE. Passing both works everywhere.
      - name: Configure
        run: cmake -S . -B build ${{ matrix.platform.cmake-args }} -DCMAKE_BUILD_TYPE=${{ matrix.config }}

      - name: Build
        run: cmake --build build --config ${{ matrix.config }}

      - name: Test
        run: ctest --test-dir build/tests -C ${{ matrix.config }} --output-on-failure

  # Not one of the platforms, but the cheapest way to catch GC bugs (missing roots / write barriers):
  # collect on every allocation and verify the heap after every collection, under ASan + UBSan.
  gc-stress:
    name: Linux GC stress (ASan + UBSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=g++
          "-DCMAKE_CXX_FLAGS=-O1 -fsanitize=address,undefined -fno-omit-frame-pointer -DBLOOP_GC_STRESS -DBLOOP_GC_VERIFY"
          "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build --target bloop_test

      # The allocation heavy tests are too slow when the whole heap is verified after every allocation
      - name: Test
        working-directory: build/tests
        run: >
          ./bloop_test
          "~gc | long lived*" "~gc | the old generation*" "~gc | short lived*" "~gc | closures created*"
          "~long array literal (20000 elements)"
